# Default values for packistry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/packistry/packistry
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Environment variables for the Packistry container (NAME: value).
# A value can also be a valueFrom object, e.g.:
#   DB_PASSWORD:
#     valueFrom:
#       secretKeyRef:
#         name: packistry-db
#         key: password
# See https://packistryphp.com/docs/installation
env: {}
  # APP_URL: https://packistry.example.com
  # TRUSTED_PROXIES: "*"
  # DB_CONNECTION: mysql
  # DB_HOST: mysql.example.internal
  # DB_PORT: "3306"
  # DB_DATABASE: packistry
  # DB_USERNAME: packistry
  # FILESYSTEM_DISK: s3
  # AWS_BUCKET: packistry-archives
  # AWS_DEFAULT_REGION: us-east-1
  # AWS_ENDPOINT: http://minio:9000
  # AWS_USE_PATH_STYLE_ENDPOINT: "true"

# Load env variables from Secrets / ConfigMaps (all keys become env variables).
# Typically the secret with APP_KEY, DB_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
envFrom: []
  # - secretRef:
  #     name: packistry-env

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Run the pod in its own user namespace (false = user namespaces on).
# Needs Kubernetes 1.33+ (or the UserNamespacesSupport feature gate), containerd 2.x and a 6.3+ kernel on the nodes.
# Left unset, the field is not rendered and the cluster default (host user namespace) applies.
hostUsers: null

# Pod-level override of ServiceAccount token automounting (unset = inherit from the ServiceAccount).
# Packistry does not call the Kubernetes API. IRSA uses its own projected token, so false is safe with IRSA.
automountServiceAccountToken: null

# The image runs as user "packistry" (UID 100, GID 101 in ghcr.io/packistry/packistry).
# runAsNonRoot needs a numeric UID, because the image sets USER by name.
podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 100
  # runAsGroup: 101
  # seccompProfile:
  #   type: RuntimeDefault

securityContext: {}
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem must stay false: on startup the image writes to /data,
  # storage/, bootstrap/cache and the home dir (generated supervisord.conf).

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Ingresses keyed by name (e.g. internal / external).
# Each enabled entry renders an Ingress named <fullname>-<name>.
ingress:
  internal:
    enabled: false
    # Ingress class, e.g. nginx-internal
    className: ""
    annotations: {}
    labels: {}
    hosts: []
      # - host: packistry.internal.example.com
      #   paths:            # optional, defaults to "/" with pathType Prefix
      #     - path: /
      #       pathType: Prefix
    tls: []
      # - secretName: packistry-internal-tls
      #   hosts:
      #     - packistry.internal.example.com
  external:
    enabled: false
    # Ingress class, e.g. nginx-external
    className: ""
    annotations: {}
    labels: {}
    hosts: []
    tls: []

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to (required when enabled).
  parentRefs: []
    # - name: gateway
    #   sectionName: https
    #   namespace: gateway-system
  # Hostnames matching the HTTP Host header. Empty = all hostnames of the Gateway listener.
  hostnames: []
    # - packistry.example.com
  # Routing rules. Each rule may set matches and filters, the backend is always this service.
  # The default sends all paths to Packistry.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # filters:
      #   - type: RequestHeaderModifier
      #     requestHeaderModifier:
      #       set:
      #         - name: X-Example
      #           value: example

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# /up is the Laravel health endpoint ("/" always returns the static index.html).
# The image runs config/route cache + migrations before starting RoadRunner, so give
# the liveness probe time to avoid killing the container during the first start.
livenessProbe:
  httpGet:
    path: /up
    port: http
  initialDelaySeconds: 60
readinessProbe:
  httpGet:
    path: /up
    port: http

# Overrides the image's /etc/supervisord.tpl (envsubst runs over it on startup).
# The default sends supervisord, RoadRunner and queue worker output to the container's
# stdout/stderr (the image logs to files), so it shows in `kubectl logs` and log shippers.
# Set to "" to keep the image's own config.
supervisordConfig: |
  [supervisord]
  nodaemon=true
  logfile=/dev/stdout
  logfile_maxbytes=0

  [program:worker]
  process_name=%(program_name)s_%(process_num)02d
  command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600
  autostart=true
  autorestart=true
  stopasgroup=true
  killasgroup=true
  user=packistry
  numprocs=$WORKER_NUMPROCS
  stdout_logfile=/dev/stdout
  stdout_logfile_maxbytes=0
  stderr_logfile=/dev/stderr
  stderr_logfile_maxbytes=0
  stopwaitsecs=3600

  [program:roadrunner]
  directory=/var/www/html
  command=rr serve -c .rr.production.yaml
  user=packistry
  autostart=true
  autorestart=true
  stdout_logfile=/dev/stdout
  stdout_logfile_maxbytes=0
  stderr_logfile=/dev/stderr
  stderr_logfile_maxbytes=0

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget for voluntary disruptions (node drains, Karpenter consolidation).
# Set either minAvailable or maxUnavailable, not both (neither set = maxUnavailable: 1).
# With a single replica, minAvailable: 1 blocks node drains completely.
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Pod topology spread constraints. When `labelSelector` is omitted,
# it defaults to the chart's selector labels.
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
